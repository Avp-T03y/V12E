server {
    listen 8080;

    # Dashboard files (HTML / JS / CSS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Browser calls /api/score -> nginx forwards to http://api:8000/score
    # The trailing "/" on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Needed for GET /stream (Server-Sent Events): send each event immediately
        # instead of holding it in a buffer, and don't cut long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
